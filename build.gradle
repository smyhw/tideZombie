// 声明构建脚本的Groovy版本（可选，默认兼容）
buildscript {
    repositories {
        mavenCentral() // 构建脚本自身的依赖仓库
    }
}

// 应用核心插件：Java基础构建、Maven发布（可选）、测试报告（可选）
plugins {
    id 'java'
}

// 项目基本信息（GAV坐标，按需修改）
group 'online.smyhw.tideZombie'       // 组织/公司标识
version '2.1.2'           // 版本号

// Java编译配置
java {
    sourceCompatibility = JavaVersion.VERSION_21 // 源码兼容版本（按需改8/17等）
}

// 依赖仓库（拉取依赖的源）
repositories {
    mavenCentral() // 中央仓库
    maven {
        url 'https://maven.aliyun.com/repository/public/'
        url = 'https://hub.spigotmc.org/nexus/content/groups/public/'
    }
}

// 依赖管理（按需添加/删除）
dependencies {
    // 编译期依赖（示例：SLF4J日志）
    implementation 'org.slf4j:slf4j-api:2.0.9'

    // 运行时依赖（示例：SLF4J简单实现）
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.9'

    // 测试依赖（JUnit 5，如需JUnit 4可替换）
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'

    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT' // The Spigot API with no shadowing. Requires the OSS repo.
}

